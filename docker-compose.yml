# Aumigo: frontend + 3 microsserviços + Kafka, agrupados no projeto "projeto-adotapet".
# Para subir tudo:  docker compose up --build
# As connection strings do MongoDB Atlas ficam no arquivo .env (veja .env.example).

name: projeto-adotapet

services:
  # Broker Kafka em modo KRaft (sem Zookeeper), com um único nó: suficiente para o projeto.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      # Identificador fixo do cluster (formato exigido pelo Kafka: UUID em base64)
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Os tópicos são criados explicitamente pelo serviço kafka-topicos
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Cria os tópicos uma vez e encerra. "compact" guarda sempre o último estado de cada
  # registro (chave = id), o que permite reconstruir as réplicas a qualquer momento.
  kafka-topicos:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        criar() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --partitions 1 --replication-factor 1 --topic "$$@"; }
        criar animais.eventos --config cleanup.policy=compact
        criar adotantes.eventos --config cleanup.policy=compact
        criar adocoes.eventos
        echo "Tópicos prontos."
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "5500:80"
    volumes:
      # Alterações nos arquivos do frontend aparecem ao recarregar a página
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - animais
      - adotantes
      - adocoes
    restart: unless-stopped

  animais:
    build: ./services/animais
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # Datas (ex.: idade mínima de 21 anos) no horário de Brasília, não em UTC
      TZ: America/Sao_Paulo
      DB_NAME: animais_db
      MONGODB_URI: ${ANIMAIS_MONGODB_URI:?Defina ANIMAIS_MONGODB_URI no arquivo .env}
    volumes:
      # Reinicia o serviço automaticamente ao salvar um arquivo em src/
      - ./services/animais/src:/app/src
    command: [ "node", "--watch", "src/server.js" ]
    healthcheck: &healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:$$PORT/health || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  adotantes:
    build: ./services/adotantes
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      # Datas (ex.: idade mínima de 21 anos) no horário de Brasília, não em UTC
      TZ: America/Sao_Paulo
      DB_NAME: adotantes_db
      MONGODB_URI: ${ADOTANTES_MONGODB_URI:?Defina ADOTANTES_MONGODB_URI no arquivo .env}
    volumes:
      - ./services/adotantes/src:/app/src
    command: [ "node", "--watch", "src/server.js" ]
    healthcheck: *healthcheck
    restart: unless-stopped

  adocoes:
    build: ./services/adocoes
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      # Datas (ex.: idade mínima de 21 anos) no horário de Brasília, não em UTC
      TZ: America/Sao_Paulo
      DB_NAME: adocoes_db
      MONGODB_URI: ${ADOCOES_MONGODB_URI:?Defina ADOCOES_MONGODB_URI no arquivo .env}
      # Dentro da rede do Docker, cada serviço é encontrado pelo próprio nome
      ANIMAIS_API_URL: http://animais:3001
      ADOTANTES_API_URL: http://adotantes:3002
    volumes:
      - ./services/adocoes/src:/app/src
    command: [ "node", "--watch", "src/server.js" ]
    healthcheck: *healthcheck
    depends_on:
      - animais
      - adotantes
    restart: unless-stopped

  # Testes de integração (Pessoa 9). Não sobe com o "up". Com o projeto rodando:
  #   docker compose run --rm testes            -> fluxo completo + cenários de erro
  #   docker compose run --rm testes --queda    -> serviço fora do ar (pare um serviço antes)
  # O relatório de evidências é salvo em tests/resultados/.
  testes:
    image: node:24-alpine
    profiles: ["testes"]
    working_dir: /tests
    volumes:
      - ./tests:/tests
    environment:
      ANIMAIS_URL: http://animais:3001
      ADOTANTES_URL: http://adotantes:3002
      ADOCOES_URL: http://adocoes:3003
    entrypoint: ["node", "integracao.js"]
